name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — these jobs are pure checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No network access to upstream sources: every source module is mocked
      # in tests.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The bundler target is what the web app consumes.
      - run: wasm-pack build core/heatmatch-wasm --target bundler --release --out-dir ../../web/src/wasm
      # The smoke test needs the nodejs target: the bundler output imports the
      # .wasm file directly, which Node cannot resolve on its own.
      - run: wasm-pack build core/heatmatch-wasm --target nodejs --release --out-dir pkg-node
      # Exercises GeoJSON parsing, serde-wasm-bindgen conversion and the
      # generated types together — the only test that crosses the real boundary.
      - run: node core/heatmatch-wasm/tests/smoke.mjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # The TypeScript types for the engine are generated by wasm-pack, so they
      # must exist before anything type-checks against them.
      - run: pnpm run wasm
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      # prebuild runs wasm-pack + copy-data.
      - run: pnpm build
        working-directory: web

  data-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Fails if data/manifest.json disagrees with the hashes of the files it
      # names — i.e. someone edited a geojson without rerunning the pipeline.
      - run: uv run --no-project python scripts/check_manifest.py
