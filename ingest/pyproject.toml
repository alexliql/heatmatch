[project]
name = "heatmatch-ingest"
version = "0.1.0"
description = "Offline data preparation for heatmatch. Writes data/*.geojson + manifest.json."
# Pinned to 3.12: geopandas/pyarrow wheel coverage on 3.13+ is still patchy and
# this pipeline is run rarely and offline, so there is nothing to gain from newer.
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2",
    "pandas",
    "pyarrow",
    "requests",
    "pydantic>=2",
    "rapidfuzz",
    "typer",
    "pyproj",
]

[project.scripts]
ingest = "ingest.cli:app"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
