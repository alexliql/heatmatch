[workspace]
resolver = "2"
members = ["heatmatch-core", "heatmatch-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

# Pinned once here so the core and wasm crates can never disagree on a
# serde/geo version — the two crates share types across the wasm boundary.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo = "0.28"
geojson = "0.24"
rstar = "0.12"
enum-map = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde", "union"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
