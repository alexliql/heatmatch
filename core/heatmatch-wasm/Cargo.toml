[package]
name = "heatmatch-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wasm-bindgen wrapper around heatmatch-core."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
heatmatch-core = { path = "../heatmatch-core", features = ["ts"] }
serde.workspace = true
serde_json.workspace = true
geo.workspace = true
geojson.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# wasm-opt downloads a binaryen release on first use, which makes every build
# depend on a GitHub download and has already broken CI once. The release
# profile already runs LTO at opt-level 3; the extra shrink is not worth an
# unreliable build.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
